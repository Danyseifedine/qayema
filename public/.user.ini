; Upload limits for PHP-FPM (read from the web root on every request).
; Images up to 20 MB are accepted and then optimised to a small WebP
; (App\Services\Media\UploadLimits, MediaService). The body limit is a little
; larger for the multipart overhead. Keep in step with `composer serve` and the
; web server's own body limit (nginx: client_max_body_size 25m).
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
